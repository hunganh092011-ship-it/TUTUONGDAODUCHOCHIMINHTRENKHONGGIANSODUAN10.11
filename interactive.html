<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tương tác &amp; Trắc nghiệm AI — Lớp 10.11</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="interactive" class="min-h-screen">
<div id="auth-toast" class="hidden"></div>

<header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b" style="border-color:var(--color-border)">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-10 h-10 rounded-full brand-gradient flex items-center justify-center text-white font-bold">10.11</div>
      <p class="font-extrabold" style="color:var(--color-primary)">Lớp 10.11 Số</p>
    </a>
    <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-neutral-700">
      <a href="index.html" class="hover:opacity-70">Trang chủ</a>
      <a href="media.html" class="hover:opacity-70">Xưởng Media</a>
      <a href="interactive.html" style="color:var(--color-primary)">Tương tác</a>
      <a href="forum.html" class="hover:opacity-70">Thảo luận</a>
      <a href="admin.html" class="hover:opacity-70" data-require-role="SuperAdmin">Quản trị</a>
    </nav>
    <div class="flex items-center gap-2">
      <button id="btn-login" data-auth="guest" class="btn-primary text-sm">Đăng nhập</button>
      <div data-auth="user" class="hidden items-center gap-2">
        <span class="text-sm font-semibold hidden sm:inline" data-user-name></span>
        <button id="btn-logout" class="text-xs text-neutral-500 underline">Đăng xuất</button>
      </div>
    </div>
  </div>
</header>

<section class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
  <h1 class="text-3xl font-extrabold">Mini-Quiz Trắc nghiệm AI</h1>
  <p class="text-neutral-600 mt-1">Trả lời đúng từ 80% để nhận Chứng nhận Số!</p>

  <div id="quiz-box" class="card p-6 mt-6"></div>

  <div id="result-box" class="hidden card p-6 mt-6 text-center">
    <p class="text-lg font-extrabold">Kết quả: <span id="result-score"></span>%</p>
    <p id="result-msg" class="text-sm text-neutral-600 mt-1"></p>
    <div id="badge-form" class="hidden mt-4 space-y-3 max-w-sm mx-auto text-left">
      <input id="badge-name" placeholder="Họ và tên" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--color-border)">
      <input id="badge-class" placeholder="Lớp" value="10.11" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--color-border)">
      <button onclick="generateBadge()" class="btn-primary w-full text-sm">🏅 Xuất Chứng nhận Số</button>
    </div>
    <button onclick="location.reload()" class="btn-outline text-sm mt-4">Làm lại Quiz</button>
  </div>

  <div id="badge-output" class="hidden mt-6 text-center">
    <canvas id="badge-canvas" width="640" height="420" class="mx-auto rounded-xl shadow-xl max-w-full"></canvas>
    <div class="flex justify-center gap-3 mt-4">
      <button onclick="downloadBadge()" class="btn-primary text-sm">⬇ Tải chứng nhận</button>
      <button onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href))" class="btn-outline text-sm">Chia sẻ Facebook</button>
    </div>
  </div>
</section>

<footer class="border-t mt-10 py-8 text-center text-sm text-neutral-500" style="border-color:var(--color-border)">
  <p>© 2026 Lớp 10.11 · THPT Võ Minh Đức</p>
</footer>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  let QUIZ = [], current = 0, correctCount = 0, answers = [];

  async function loadQuiz() {
    QUIZ = await SheetsAPI.fetchSheet("Quiz");
    renderQuestion();
  }
  function renderQuestion() {
    if (current >= QUIZ.length) { finishQuiz(); return; }
    const q = QUIZ[current];
    document.getElementById("quiz-box").innerHTML = `
      <p class="text-xs text-neutral-400">Câu ${current + 1}/${QUIZ.length}</p>
      <h2 class="font-bold text-lg mt-1">${q.Question}</h2>
      <div class="mt-4 space-y-2">
        ${["A","B","C","D"].map(opt => `
          <button onclick="answerQuiz('${opt}')" class="w-full text-left border rounded-lg px-4 py-2.5 text-sm hover:bg-neutral-50" style="border-color:var(--color-border)">
            <b>${opt}.</b> ${q["Option" + opt]}
          </button>`).join("")}
      </div>
      <div id="explain-box" class="hidden mt-4 text-sm rounded-lg p-3"></div>`;
  }
  function answerQuiz(opt) {
    const q = QUIZ[current];
    const isCorrect = opt === q.CorrectAnswer;
    if (isCorrect) correctCount++;
    answers.push({ q: q.QuizID, opt, isCorrect });
    const box = document.getElementById("explain-box");
    box.className = "mt-4 text-sm rounded-lg p-3 " + (isCorrect ? "bg-green-50" : "bg-red-50");
    box.style.color = isCorrect ? "#0a7a5a" : "var(--color-primary)";
    box.textContent = (isCorrect ? "✓ Chính xác! " : `✗ Chưa đúng. Đáp án đúng: ${q.CorrectAnswer}. `) + (q.Explanation || "");
    box.classList.remove("hidden");
    document.querySelectorAll("#quiz-box button").forEach(b => b.disabled = true);
    setTimeout(() => { current++; renderQuestion(); }, 1800);
  }
  function finishQuiz() {
    const pct = Math.round((correctCount / QUIZ.length) * 100);
    document.getElementById("quiz-box").innerHTML = "";
    document.getElementById("result-box").classList.remove("hidden");
    document.getElementById("result-score").textContent = pct;
    const msg = document.getElementById("result-msg");
    SheetsAPI.writeSheet("Analytics", { MetricName: "QuizAttempts", Value: 1 }, "increment");
    if (pct >= 80) {
      msg.textContent = "Xuất sắc! Bạn đủ điều kiện nhận Chứng nhận Số.";
      msg.style.color = "var(--color-green)";
      document.getElementById("badge-form").classList.remove("hidden");
    } else {
      msg.textContent = "Cần đạt từ 80% để nhận Chứng nhận Số. Hãy thử lại nhé!";
      msg.style.color = "var(--color-primary)";
    }
    window._quizScore = pct;
  }
  function generateBadge() {
    const name = document.getElementById("badge-name").value || "Học sinh";
    const className = document.getElementById("badge-class").value || "10.11";
    const canvas = document.getElementById("badge-canvas");
    AI.drawBadge(canvas, { name, className, score: window._quizScore });
    document.getElementById("badge-output").classList.remove("hidden");
  }
  function downloadBadge() {
    const canvas = document.getElementById("badge-canvas");
    const link = document.createElement("a");
    link.download = "chung-nhan-so-lop10.11.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }
  loadQuiz();
</script>
</body>
</html>
